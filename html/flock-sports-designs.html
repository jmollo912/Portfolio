<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flock Sports — Designs</title>
    <meta name="description" content="Additional Flock Sports social media graphics by Giuseppe Mollo.">
    <link rel="icon" href="../media/Icons/gmWebLogo.jpg" type="image/jpeg">
    <link rel="canonical" href="/html/flock-sports-designs.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/FlockSports.css">
    <link rel="stylesheet" href="../vendor/lenis/lenis.css">
    <script src="../vendor/lenis/lenis.min.js" defer></script>
    <script defer src="../main.js"></script>
</head>
<body class="flock-designs-page">
    <div class="flock-designs-back-container">
        <a href="case-study-FlockSports.html#designs" class="case-back-link" aria-label="Back to Flock Sports case study">
            <span class="case-back-arrow" aria-hidden="true"></span>
            <span>Back</span>
        </a>
    </div>
    <main class="flock-designs-page-main">
        <div class="flock-designs-page-inner">
            <h1 class="sr-only">Flock Sports — Designs</h1>
            <div class="flock-designs-grid" id="flock-designs-grid"></div>
        </div>
    </main>

    <div class="flock-designs-lightbox" id="flock-designs-lightbox" hidden>
        <div class="flock-designs-lightbox-backdrop" data-flock-lightbox-close tabindex="-1" aria-hidden="true"></div>
        <div class="flock-designs-lightbox-content" role="dialog" aria-modal="true" aria-label="Design viewer">
            <button type="button" class="flock-designs-lightbox-arrow flock-designs-lightbox-arrow--prev" data-flock-lightbox-prev aria-label="Previous design">
                <span aria-hidden="true"></span>
            </button>
            <div class="flock-designs-lightbox-stage">
                <button type="button" class="flock-designs-lightbox-close" data-flock-lightbox-close aria-label="Close design viewer">
                    <span aria-hidden="true">&times;</span>
                </button>
                <div class="flock-designs-lightbox-frame">
                    <img src="" alt="" class="flock-designs-lightbox-image" id="flock-designs-lightbox-slide">
                </div>
                <p class="flock-designs-lightbox-counter" id="flock-designs-lightbox-counter" aria-live="polite"></p>
            </div>
            <button type="button" class="flock-designs-lightbox-arrow flock-designs-lightbox-arrow--next" data-flock-lightbox-next aria-label="Next design">
                <span aria-hidden="true"></span>
            </button>
        </div>
    </div>
</body>
</html>
